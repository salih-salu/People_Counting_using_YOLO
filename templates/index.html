<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YOLO People Counter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      overflow: hidden;
    }
    .container {
      width: 100%;
      max-width: 820px;
      max-height: 100%;
      background: rgba(30, 41, 59, 0.78);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      background: rgba(148, 163, 184, 0.15);
      color: #cbd5e1;
    }
    .badge.running { background: rgba(16, 185, 129, 0.18); color: #34d399; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #94a3b8; }
    .badge.running .dot {
      background: #34d399;
      box-shadow: 0 0 10px #34d399;
      animation: pulse 1.4s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .video-wrap {
      width: 100%;
      background: #020617;
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      max-height: 54vh;
    }
    .video-wrap img {
      width: 100%;
      max-height: 54vh;
      object-fit: contain;
      display: block;
    }

    .bottom {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 12px;
      align-items: stretch;
    }
    .card {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(148, 163, 184, 0.14);
      border-radius: 14px;
      padding: 12px 14px;
      text-align: center;
    }
    .card .label { font-size: 0.72rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.06em; }
    .card .value { font-size: 1.75rem; font-weight: 700; margin-top: 2px; }
    .ab .value { color: #34d399; }
    .ba .value { color: #fb923c; }
    .total .value { color: #38bdf8; }

    .controls { display: flex; flex-direction: column; gap: 8px; min-width: 150px; }
    button {
      flex: 1;
      padding: 10px 16px;
      border: none;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.2s ease;
    }
    button:active:not(:disabled) { transform: scale(0.98); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-start { background: #10b981; color: #052e16; }
    .btn-stop { background: #f43f5e; color: #fff; }

    @media (max-width: 640px) {
      .bottom { grid-template-columns: repeat(3, 1fr); }
      .controls { grid-column: 1 / -1; flex-direction: row; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>YOLO People Counter</h1>
      <div id="statusBadge" class="badge">
        <span class="dot"></span>
        <span id="statusText">Idle</span>
      </div>
    </div>

    <div class="video-wrap">
      <img id="videoStream" src="/preview.jpg" alt="People Counter Video" />
    </div>

    <div class="bottom">
      <div class="card ab">
        <div class="label">A &rarr; B</div>
        <div class="value" id="countAB">0</div>
      </div>
      <div class="card ba">
        <div class="label">B &rarr; A</div>
        <div class="value" id="countBA">0</div>
      </div>
      <div class="card total">
        <div class="label">Total</div>
        <div class="value" id="countTotal">0</div>
      </div>
      <div class="controls">
        <button id="startBtn" class="btn-start" onclick="startCounter()">Start</button>
        <button id="stopBtn" class="btn-stop" onclick="stopCounter()" disabled>Stop</button>
      </div>
    </div>
  </div>

  <script>
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const badge = document.getElementById("statusBadge");
    const statusText = document.getElementById("statusText");
    const videoStream = document.getElementById("videoStream");
    let wasRunning = false;

    async function startCounter() {
      await fetch("/start", { method: "POST" });
      videoStream.src = "/video_feed?t=" + Date.now();
      wasRunning = true;
      refreshStatus();
    }

    async function stopCounter() {
      await fetch("/stop", { method: "POST" });
      refreshStatus();
    }

    async function refreshStatus() {
      try {
        const res = await fetch("/status");
        const data = await res.json();

        document.getElementById("countAB").textContent = data.count_ab;
        document.getElementById("countBA").textContent = data.count_ba;
        document.getElementById("countTotal").textContent = data.total;

        badge.classList.toggle("running", data.running);
        statusText.textContent = data.running ? "Running" : "Idle";
        startBtn.disabled = data.running;
        stopBtn.disabled = !data.running;

        if (data.running && !wasRunning) {
          videoStream.src = "/video_feed?t=" + Date.now();
        }
        wasRunning = data.running;
      } catch (e) {}
    }

    setInterval(refreshStatus, 500);
    refreshStatus();
  </script>
</body>
</html>
